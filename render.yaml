services:
  # Backend Django service
  - type: web
    name: hospital-referral-backend
    rootDir: Backend                          # Path to your Django code
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn Hospital_Referral_System.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Important: Set this to your frontend URL after it's deployed
      - key: FRONTEND_URL
        value: https://your-frontend-url.onrender.com

  # Frontend service (adjust commands for your specific framework)
  - type: web
    name: hospital-referral-frontend
    rootDir: Frontend                         # Path to your frontend code
    env: node
    buildCommand: npm install && npm run build   # Or 'yarn', 'pnpm', etc.
    startCommand: npx serve -s build          # For a simple static file server
    # If your frontend runs on a different port, set it here.
    # The 'serve' package usually uses port 3000 by default.

databases:
  - name: hospital-db
    plan: free