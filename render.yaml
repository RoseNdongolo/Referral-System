services:
  - type: web
    name: hospital-referral-backend
    rootDir: Backend/Hospital_Referral_System   # <-- exact path
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn Hospital_Referral_System.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: FRONTEND_URL
        value: https://hospital-referral-frontend.onrender.com
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  - type: web
    name: hospital-referral-frontend
    rootDir: Frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build

databases:
  - name: hospital-db
    plan: free
    

services:
  - type: web
    name: hospital-referral-backend
    rootDir: Backend
    plan: free              # <-- ADD THIS LINE
    env: python
    # ... rest of your configuration
  - type: web
    name: hospital-referral-frontend
    rootDir: Frontend
    plan: free              # <-- ADD THIS LINE
    env: node
