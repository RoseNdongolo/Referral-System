services:
  - type: web
    name: hospital-referral-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn Hospital_Referral_System.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app   # update later

databases:
  - name: hospital-db
    plan: free